<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body{background:#0e0804;font-family:'Cinzel',serif;color:#f5e6c8;overflow-x:hidden}

/* ── TYPOGRAPHY ── */
.title-main{
  font-family:'Cinzel Decorative',serif;font-weight:900;
  background:linear-gradient(180deg,#ffe066 0%,#d4a017 45%,#a07010 100%);

.tribe-card{border:1.5px solid rgba(255,255,255,.1);border-radius:10px;padding:.9rem .5rem;

/* ── BUTTONS ── */

  background:linear-gradient(135deg,#d4a017,#9a7010);color:#100800;border:none;

.btn-danger{background:transparent;color:#c84040;border:1px solid rgba(200,64,64,.4);

.btn-small{border:1px dashed rgba(212,160,23,.35);border-radius:8px;background:transparent;

.btn-small:hover{background:rgba(212,160,23,.08)}

/* ── BARS ── */
.admin-bar{
  display:flex;align-items:center;justify-content:space-between;gap:.8rem;

/* ── CATEGORY TABS ── */
.cat-tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.2rem}
.cat-tab{border:1px solid rgba(212,160,23,.25);border-radius:999px;background:rgba(255,255,255,.03);
  color:#a08040;font-family:'Cinzel',serif;font-size:.68rem;font-weight:600;

.cat-tab.active{background:rgba(212,160,23,.2);color:#ffd700;border-color:rgba(212,160,23,.55);
  box-shadow:0 0 10px rgba(212,160,23,.2)}
.cat-tab .done-dot{width:6px;height:6px;border-radius:50%;background:#40c060;display:inline-block}

/* ── SCORE INPUTS ── */
.score-row{display:flex;align-items:center;gap:.8rem;padding:.5rem .3rem;border-bottom:1px solid rgba(255,255,255,.05)}
.score-row:last-child{border-bottom:none}

/* ── RANKING ── */

  margin-bottom:.4rem;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);transition:all .3s}
.rank-row.r1{background:rgba(212,160,23,.13);border-color:rgba(212,160,23,.38)}
.rank-row.r2{background:rgba(180,180,180,.09);border-color:rgba(180,180,180,.25)}

.rank-score{font-family:'Cinzel Decorative',serif;font-size:.95rem;font-weight:700}

/* ── DETAIL TABLE (points par catégorie) ── */
.detail-wrap{overflow-x:auto;scrollbar-width:thin;scrollbar-color:rgba(212,160,23,.3) transparent;
  border-radius:10px;-webkit-overflow-scrolling:touch}
.detail-table{width:100%;border-collapse:collapse;font-size:.72rem;min-width:640px}

.detail-table th:first-child{text-align:left;position:sticky;left:0;background:#171008;z-index:2}

.detail-table td:first-child{text-align:left;white-space:nowrap;position:sticky;left:0;background:#171008;z-index:1;font-weight:700;color:#e8d8b0}
.detail-table tr:last-child td{border-bottom:none}
.detail-table .tot-col{color:#ffd700;font-weight:700;font-family:'Cinzel Decorative',serif}
.detail-table .zero{color:#4a3a20}
.detail-table tr.dt-r1 td{background:rgba(212,160,23,.08)}

/* ── PUBLIC BOARD ── */
.ro-row{display:flex;align-items:center;gap:1rem;padding:.85rem 1.2rem;

  position:relative;overflow:hidden;transition:all .4s}
.ro-row .bar{position:absolute;left:0;top:0;height:100%;border-radius:10px;opacity:.13;transition:width .8s ease}
.ro-row.ro1{border-color:rgba(212,160,23,.4);background:rgba(212,160,23,.07)}
.ro-row.ro2{border-color:rgba(180,180,180,.28);background:rgba(180,180,180,.05)}
.ro-row.ro3{border-color:rgba(184,115,51,.30);background:rgba(184,115,51,.06)}
.ro-pos{font-family:'Cinzel Decorative',serif;font-size:1.2rem;min-width:36px;text-align:center;position:relative}
.ro-emo{font-size:1.7rem;min-width:36px;position:relative}
.ro-name{flex:1;font-size:clamp(.85rem,2.5vw,1rem);font-weight:700;letter-spacing:.04em;position:relative}
.ro-score{font-family:'Cinzel Decorative',serif;font-size:clamp(1.2rem,3vw,1.7rem);font-weight:700;position:relative}
.ro-pts{font-size:.62rem;color:#a08040;letter-spacing:.15em;margin-top:.1rem}

/* ── PIN ── */
.pin-box{max-width:320px;margin:0 auto;padding:2rem;text-align:center}
.pin-input{background:rgba(255,255,255,.06);border:1px solid rgba(212,160,23,.35);
  border-radius:10px;color:#ffd700;font-family:'Cinzel Decorative',serif;
  font-size:1.6rem;text-align:center;padding:.6rem 1rem;width:160px;letter-spacing:.4em}
.pin-input:focus{outline:none;border-color:#ffd700;box-shadow:0 0 12px rgba(212,160,23,.3)}
.pin-error{color:#e05050;font-size:.75rem;margin-top:.5rem;min-height:1.2rem}

/* ── LIVE DOT ── */
@keyframes livepulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.6)}}
.live-dot{width:7px;height:7px;background:#40e080;border-radius:50%;display:inline-block;
  animation:livepulse 1.8s ease-in-out infinite;margin-right:.35rem;vertical-align:middle}

@keyframes shimmer{0%,100%{opacity:.5}50%{opacity:1}}

.loader{text-align:center;padding:4rem 2rem;color:#8a7050;font-size:.85rem;letter-spacing:.15em}

#toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(80px);
  background:rgba(40,30,10,.95);border:1px solid rgba(212,160,23,.4);
  border-radius:10px;padding:.6rem 1.4rem;font-size:.8rem;color:#ffd700;
  letter-spacing:.08em;opacity:0;transition:all .4s ease;z-index:1000;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

<body>
<div class="app" id="app">
  <div class="loader">⚔️ Connexion aux Olympiades…</div>
</div>
<div id="toast"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* ══════════════════════════════════════════════════════
   DONNÉES TRIBUS & CATÉGORIES
══════════════════════════════════════════════════════ */
const TRIBES = [
 {id:'bretons',   name:'Les Alcoolos',     emo:'🍷', bg:'#281c08', acc:'#806018'},
  {id:'egyptiens', name:'Les Aplats',   emo:'🍽️', bg:'#402808', acc:'#b07018'},
  {id:'normands',  name:'Les Radins',    emo:'💸', bg:'#0d1c36', acc:'#2060b0'},
  {id:'pirates',   name:'Les Voyous',     emo:'🧢', bg:'#0a0a18', acc:'#5050c0'},
  {id:'hispaniq',  name:'Les Voleurs', emo:'🦸🏻', bg:'#4a2008', acc:'#e07018'},
  {id:'grecs',     name:'Les Kebabs',       emo:'🌯', bg:'#0e2240', acc:'#2870c8'},
  {id:'chinois',   name:'Les Ptits jaunes',     emo:'🐉', bg:'#3a0a0a', acc:'#c82020'},
  {id:'indiens',   name:'Les Rouges',     emo:'🪶', bg:'#2a1a00', acc:'#d48010'},
  {id:'romains',   name:'Les Ritals',     emo:'🍗', bg:'#540e0e', acc:'#d42020'},
];
const ALL_IDS = TRIBES.map(t => t.id);

/* Les 9 catégories de points */
const CATEGORIES = [
  {id:'degustation', name:'Dégustation',        emo:'🍖', short:'Dégust.'},
  {id:'enigme',      name:'Énigme',             emo:'🧩', short:'Énigme'},
  {id:'hercule',     name:"Épreuve d'Hercule",  emo:'💪', short:'Hercule'},
  {id:'relais',      name:'Relais',             emo:'🏃', short:'Relais'},
  {id:'livret',      name:'Livret',             emo:'📜', short:'Livret'},
  {id:'parade',      name:'Saynète',            emo:'🎬', short:'Saynète'},
  {id:'potion',      name:'Potion magique',     emo:'⚗️', short:'Potion'},
  {id:'deguisement', name:'Déguisement',        emo:'🎭', short:'Déguis.'},
  {id:'bonus',       name:'Bonus',              emo:'⭐', short:'Bonus'},
];

/* ══════════════════════════════════════════════════════
   FIREBASE INIT (sécurisé)
══════════════════════════════════════════════════════ */
let db = null, REF = null, PIN_REF = null;
let firebaseOK = false;
let firebaseError = '';

function configLooksValid() {
  const c = FIREBASE_CONFIG;
  if (!c) return false;
  if (!c.apiKey || c.apiKey.includes('COLLE_TON') || c.apiKey.includes('ICI')) return false;
  if (!c.databaseURL || c.databaseURL.includes('TON_PROJET')) return false;
  return true;
}

try {
  if (typeof firebase === 'undefined') {
    firebaseError = 'Le SDK Firebase n\'a pas pu être chargé (connexion internet ?).';
  } else if (!configLooksValid()) {
    firebaseError = 'CONFIG_MANQUANTE';
  } else {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    REF = db.ref('olympiades/game');
    PIN_REF = db.ref('olympiades/pin');
    firebaseOK = true;
  }
} catch (e) {
  firebaseError = 'Erreur Firebase : ' + e.message;
}

/* ══════════════════════════════════════════════════════
   STATE
   gs.scores = { tribeId: { categoryId: points } }
══════════════════════════════════════════════════════ */
let gs = {
  phase: 'waiting',        // waiting | game
  selected: [...ALL_IDS],
  scores: {}
};
let ui = {
  mode: 'loading',         // loading | public | pin-entry | admin-setup | admin-game
  pinInput: '',
  pinError: '',
  clickCount: 0,
  clickTimer: null,
  activeCat: 'degustation',
  inputs: {}               // saisie en cours pour la catégorie active
};
let adminPin = DEFAULT_PIN;

/* ══════════════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════════════ */
const tribe = id => TRIBES.find(t => t.id === id);
const cat   = id => CATEGORIES.find(c => c.id === id);

function catScore(tribeId, catId) {
  return (gs.scores[tribeId] && gs.scores[tribeId][catId]) || 0;
}
function total(tribeId) {
  return CATEGORIES.reduce((sum, c) => sum + catScore(tribeId, c.id), 0);
}
const ranking = () => [...gs.selected].sort((a, b) => total(b) - total(a));

function catHasScores(catId) {
  return gs.selected.some(id => catScore(id, catId) !== 0);
}
function catsFilledCount() {
  return CATEGORIES.filter(c => catHasScores(c.id)).length;
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

/* ══════════════════════════════════════════════════════
   FIREBASE READ/WRITE
══════════════════════════════════════════════════════ */
function saveState() {
  if (!firebaseOK) { toast('⚠️ Firebase non configuré — pas de sauvegarde'); return Promise.resolve(); }
  return REF.set(gs).catch(e => toast('⚠️ Erreur de sauvegarde : ' + e.message));
}

function listenState() {
  if (!firebaseOK) return;
  REF.on('value', snap => {
    const val = snap.val();
    if (val) {
      gs = val;
      if (!gs.scores) gs.scores = {};
      if (!gs.selected) gs.selected = [...ALL_IDS];
    }
    if (ui.mode === 'public' || ui.mode === 'loading') {
      ui.mode = 'public';
      render();
    }
  }, err => {
    firebaseError = 'Accès refusé à la base : vérifie les règles Firebase (mode test). ' + err.message;
    ui.mode = 'public';
    render();
  });
}

async function loadPin() {
  if (!firebaseOK) return;
  try {
    const snap = await PIN_REF.once('value');
    if (snap.val()) adminPin = snap.val();
  } catch (e) { /* pin par défaut conservé */ }
}
function savePin(pin) {
  adminPin = pin;
  if (!firebaseOK) return Promise.resolve();
  return PIN_REF.set(pin);
}

/* ══════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════ */
async function init() {
  /* Si Firebase n'est pas dispo : afficher quand même la page */
  if (!firebaseOK) {
    ui.mode = 'public';
    render();
    return;
  }
  await loadPin();
  listenState();
  /* Filet de sécurité : si aucune donnée reçue en 6s, on affiche quand même */
  setTimeout(() => {
    if (ui.mode === 'loading') { ui.mode = 'public'; render(); }
  }, 6000);
}

/* ══════════════════════════════════════════════════════
   RENDER ROUTER
══════════════════════════════════════════════════════ */
function render() {
  const app = document.getElementById('app');
  if (ui.mode === 'loading') return;

  if (ui.mode === 'public')      { app.innerHTML = buildPublic();      bindPublic();      return; }
  if (ui.mode === 'pin-entry')   { app.innerHTML = buildPin();         bindPin();         return; }
  if (ui.mode === 'admin-setup') { app.innerHTML = buildAdminSetup();  bindAdminSetup();  return; }
  if (ui.mode === 'admin-game')  { app.innerHTML = buildAdminGame();   bindAdminGame();   return; }
}

/* ══════════════════════════════════════════════════════
   TABLEAU DÉTAIL PAR CATÉGORIE (partagé public + admin)
══════════════════════════════════════════════════════ */
function buildDetailTable() {
  const rnk = ranking();
  return `
  <div class="glass" style="margin-top:1.5rem;padding:1rem">
    <p class="section-label" style="margin-bottom:.8rem">📋 Détail des points par épreuve</p>
    <div class="detail-wrap">
      <table class="detail-table">
        <thead>
          <tr>
            <th>Tribu</th>
            ${CATEGORIES.map(c => `<th title="${c.name}">${c.emo}<br>${c.short}</th>`).join('')}
            <th style="color:#ffd700">🏆<br>Total</th>
          </tr>
        </thead>
        <tbody>
          ${rnk.map((id, i) => {
            const t = tribe(id);
            const rowCls = i === 0 ? 'dt-r1' : i === 1 ? 'dt-r2' : i === 2 ? 'dt-r3' : '';
            return `
            <tr class="${rowCls}">
              <td>${t.emo} ${t.name.replace('Les ','')}</td>
              ${CATEGORIES.map(c => {
                const v = catScore(id, c.id);
                return `<td class="${v === 0 ? 'zero' : ''}">${v}</td>`;
              }).join('')}
              <td class="tot-col">${total(id)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

/* ══════════════════════════════════════════════════════
   PUBLIC VIEW
══════════════════════════════════════════════════════ */
function buildPublic() {
  if (firebaseError === 'CONFIG_MANQUANTE') return buildConfigHelp();
  const banner = firebaseError && firebaseError !== 'CONFIG_MANQUANTE'
    ? `<div style="background:rgba(200,64,64,.15);border:1px solid rgba(200,64,64,.4);border-radius:10px;
        padding:.8rem 1.2rem;margin:1rem auto;max-width:700px;font-size:.75rem;color:#e08080;text-align:center">
        ⚠️ ${firebaseError}</div>`
    : '';
  if (gs.phase === 'waiting') return banner + buildWaiting();
  return banner + buildLiveBoard();
}

function buildConfigHelp() {
  return `
  <div class="screen" style="max-width:640px">
    <div style="text-align:center;padding:2.5rem 0 1.5rem">
      <div style="font-size:3rem;margin-bottom:.6rem">🏛️</div>
      <h1 class="title-main" style="font-size:clamp(1.4rem,4vw,2.2rem)">OLYMPIADES JULES CÉSAR</h1>
      <p class="title-sub" style="margin-top:.4rem">Configuration requise</p>
    </div>
    <div class="glass">
      <p class="section-label">🔧 Dernière étape avant le lancement !</p>
      <p style="font-size:.82rem;line-height:1.7;color:#d0c0a0">
        Le site fonctionne, mais il lui manque sa <strong style="color:#ffd700">connexion Firebase</strong>
        pour synchroniser les scores en temps réel. Voici comment faire :
      </p>
      <ol style="font-size:.78rem;line-height:2;color:#c0b090;margin:1rem 0 1rem 1.4rem">
        <li>Va sur <strong style="color:#ffd700">console.firebase.google.com</strong></li>
        <li>Crée un projet (gratuit) puis une <strong>Realtime Database</strong> en mode test</li>
        <li>Paramètres du projet → Mes applications → Web <code style="color:#ffd700">&lt;/&gt;</code></li>
        <li>Copie le bloc <code style="color:#ffd700">firebaseConfig</code></li>
        <li>Ouvre <code style="color:#ffd700">index.html</code> et colle tes valeurs
            dans <code style="color:#ffd700">FIREBASE_CONFIG</code> tout en haut du fichier</li>
        <li>Ré-uploade le fichier sur GitHub — c'est prêt ! 🐗</li>
      </ol>
      <p style="font-size:.68rem;color:#7a6040;border-top:1px solid rgba(255,255,255,.08);padding-top:.8rem">
        💡 Vérifie surtout <code>apiKey</code> et <code>databaseURL</code> : tant qu'ils contiennent
        les textes d'exemple, cet écran s'affichera.
      </p>
    </div>
  </div>`;
}

function buildWaiting() {
  return `
  <div class="screen" style="text-align:center;padding-top:3.5rem">
    <div id="titlezone" style="display:inline-block;cursor:default">
      <div class="shimmer" style="font-size:3.5rem;margin-bottom:.8rem">🏛️</div>
      <h1 class="title-main">OLYMPIADES<br>JULES CÉSAR</h1>
    </div>
    <p class="title-sub" style="margin-top:.6rem">Le grand tournoi des tribus</p>
    <div style="margin-top:3rem;padding:2rem 2.5rem;border:1px solid rgba(212,160,23,.2);border-radius:14px;background:rgba(255,255,255,.03);display:inline-block">
      <div class="shimmer" style="font-size:2.2rem;margin-bottom:.8rem">⏳</div>
      <p style="font-size:.85rem;color:#a08040;letter-spacing:.15em">En attente du début des Olympiades…</p>
      <p style="font-size:.68rem;color:#604a28;margin-top:.5rem">Reviens dans quelques instants, guerrier !</p>
    </div>
    <div style="margin-top:1.8rem;font-size:.62rem;color:#4a3820;letter-spacing:.12em">
      <span class="live-dot"></span>CONNEXION ACTIVE — MISE À JOUR EN TEMPS RÉEL
    </div>
  </div>`;
}

function buildLiveBoard() {
  const rnk = ranking();
  const maxScore = Math.max(1, ...rnk.map(id => total(id)));
  const medals = ['🥇','🥈','🥉'];
  const sc = {0:'#ffd700', 1:'#c8c8c8', 2:'#cd7f32'};
  const filled = catsFilledCount();

  return `
  <div class="screen">
    <div style="text-align:center;padding:1.5rem 0 1rem">
      <div id="titlezone" style="display:inline-block;cursor:default">
        <div style="font-size:2.5rem;margin-bottom:.5rem">🏛️</div>
        <h1 class="title-main">OLYMPIADES DES BARBARES</h1>
      </div>
      <p class="title-sub" style="margin-top:.3rem">Classement des incultes</p>
      <div style="margin-top:.7rem;font-size:.72rem;color:#8a7050">
        des plus nuls au plus mauvais
      </div>
      <div style="margin-top:.5rem;font-size:.72rem;color:#4a3820;letter-spacing:.12em">
        <span class="live-dot"></span>MISE À JOUR EN TEMPS RÉEL
      </div>
    </div>

    <!-- Classement -->
    <div style="max-width:700px;margin:0 auto">
      ${rnk.map((id, i) => {
        const t = tribe(id); const pts = total(id);
        const pct = Math.round((pts / maxScore) * 100);
        return `
        <div class="ro-row ${i < 3 ? 'ro'+(i+1) : ''}">
          <div class="bar" style="width:${pct}%;background:${t.acc}"></div>
          <div class="ro-pos" style="color:${sc[i]||'#b0a080'}">${medals[i] || i+1}</div>
          <div class="ro-emo">${t.emo}</div>
          <div style="flex:1;position:relative"><div class="ro-name">${t.name}</div></div>
          <div style="text-align:right;position:relative">
            <div class="ro-score" style="color:${sc[i]||'#e8d8b0'}">${pts}</div>
            <div class="ro-pts">points</div>
          </div>
        </div>`;
      }).join('')}
    </div>

    <!-- Tableau détail par catégorie -->
    ${buildDetailTable()}

    <div style="text-align:center;margin-top:2rem;font-size:clamp(1.8rem,5vw,2.6rem);font-weight:900;color:#ffffff;letter-spacing:.06em;line-height:1.3;text-shadow:0 3px 14px rgba(0,0,0,.75)">
      🐗 Par Toutatis ! c'est toujours Obelix qui gagne à la fin !
    </div>
    <div style="text-align:center;margin-top:1.2rem">
      <img src="photo.jpg" alt="Souvenir des Olympiades" style="max-width:100%;width:420px;border-radius:12px;border:1px solid rgba(212,160,23,.3);box-shadow:0 4px 22px rgba(0,0,0,.5)">
    </div>
  </div>`;
}

function bindPublic() {
  const tz = document.getElementById('titlezone');
  if (!tz) return;
  tz.addEventListener('click', () => {
    ui.clickCount++;
    if (ui.clickTimer) clearTimeout(ui.clickTimer);
    ui.clickTimer = setTimeout(() => { ui.clickCount = 0; }, 2000);
    if (ui.clickCount >= 5) {
      ui.clickCount = 0;
      ui.mode = 'pin-entry';
      ui.pinInput = '';
      ui.pinError = '';
      render();
    }
  });
}

/* ══════════════════════════════════════════════════════
   PIN ENTRY
══════════════════════════════════════════════════════ */
function buildPin() {
  return `
  <div class="screen" style="text-align:center;padding-top:4rem">
    <div style="font-size:2.5rem;margin-bottom:1rem">🔐</div>
    <h2 style="font-family:'Cinzel Decorative',serif;color:#d4a017;font-size:1.2rem;margin-bottom:.4rem">Accès Animateur</h2>
    <p style="font-size:.72rem;color:#8a7050;letter-spacing:.1em;margin-bottom:2rem">Entrez votre code secret</p>
    <div class="pin-box">
      <input class="pin-input" id="pinfield" type="password" maxlength="8" placeholder="••••" autocomplete="off">
      <div class="pin-error" id="pinerr">${ui.pinError}</div>
      <div style="display:flex;gap:.8rem;justify-content:center;margin-top:1.2rem">
        <button class="btn-cta" id="pinok" style="padding:.7rem 2rem;font-size:.8rem">Entrer</button>
        <button class="btn-ghost" id="pinback">Annuler</button>
      </div>
    </div>
  </div>`;
}

function bindPin() {
  const f = document.getElementById('pinfield');
  if (f) { f.focus(); f.value = ui.pinInput; }
  f?.addEventListener('input', e => { ui.pinInput = e.target.value; });
  f?.addEventListener('keydown', e => { if (e.key === 'Enter') checkPin(); });
  document.getElementById('pinok')?.addEventListener('click', checkPin);
  document.getElementById('pinback')?.addEventListener('click', () => {
    ui.mode = 'public'; render();
  });
}

function checkPin() {
  if (ui.pinInput === adminPin) {
    ui.pinError = '';
    ui.mode = gs.phase === 'waiting' ? 'admin-setup' : 'admin-game';
    loadCatInputs();
    render();
  } else {
    ui.pinError = 'Code incorrect. Réessaie.';
    document.getElementById('pinerr').textContent = ui.pinError;
    document.getElementById('pinfield').value = '';
    ui.pinInput = '';
  }
}

/* charge les scores existants de la catégorie active dans les inputs */
function loadCatInputs() {
  ui.inputs = {};
  gs.selected.forEach(id => {
    const v = catScore(id, ui.activeCat);
    ui.inputs[id] = v === 0 ? '' : String(v);
  });
}

/* ══════════════════════════════════════════════════════
   ADMIN SETUP
══════════════════════════════════════════════════════ */
function buildAdminSetup() {
  const n = gs.selected.length;
  const allOn = n === TRIBES.length;
  return `
  <div class="admin-bar">
    <span class="admin-badge">⚙️ MODE ANIMATEUR</span>
    <button class="btn-danger" id="logoutbtn" style="font-size:.68rem;padding:.35rem .8rem">Quitter</button>
  </div>
  <div class="screen">
    <div style="text-align:center;padding:1.5rem 0 1.2rem">
      <h1 class="title-main" style="font-size:clamp(1.4rem,4vw,2.4rem)">CONFIGURATION</h1>
      <p class="title-sub" style="margin-top:.3rem">Paramétrer les Olympiades</p>
    </div>

    <div class="glass" style="margin-bottom:1.2rem">
      <p class="section-label">⚔️ Tribus participantes — ${n} sélectionnée${n>1?'s':''}</p>
      <button class="btn-small" id="selall" style="margin-bottom:.8rem">${allOn ? '✕ Tout désélectionner' : '✓ Tout sélectionner'}</button>
      <div class="tribe-grid">
        ${TRIBES.map(t => {
          const on = gs.selected.includes(t.id);
          return `
          <div class="tribe-card ${on?'on':''}" data-tribe="${t.id}"
            style="${on ? `background:${t.bg};border-color:${t.acc}` : ''}">
            <span class="emo">${t.emo}</span>
            <span class="nm" style="${on ? 'color:#fff' : 'color:#c0a878'}">${t.name}</span>
            ${on ? `<span class="ck" style="color:${t.acc}">✓</span>` : ''}
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="glass" style="margin-bottom:1.2rem">
      <p class="section-label">🏅 Les 9 épreuves du tournoi</p>
      <div style="display:flex;flex-wrap:wrap;gap:.5rem">
        ${CATEGORIES.map(c => `
          <span style="display:inline-flex;align-items:center;gap:.35rem;
            background:rgba(212,160,23,.08);border:1px solid rgba(212,160,23,.2);
            border-radius:999px;padding:.35rem .9rem;font-size:.72rem;color:#d0b070">
            ${c.emo} ${c.name}
          </span>`).join('')}
      </div>
      <p style="font-size:.65rem;color:#6a5030;margin-top:.8rem">Les points se saisissent épreuve par épreuve une fois le tournoi lancé</p>
    </div>

    <div class="glass" style="margin-bottom:1.8rem">
      <p class="section-label">🔐 Modifier le code secret</p>
      <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap">
        <input id="newpin" type="text" maxlength="8" placeholder="Nouveau code…"
          style="background:rgba(255,255,255,.07);border:1px solid rgba(212,160,23,.3);border-radius:8px;
          color:#ffd700;font-family:'Cinzel',serif;font-size:1rem;padding:.5rem .8rem;width:160px">
        <button class="btn-ghost" id="savepin" style="font-size:.72rem">💾 Enregistrer</button>
        <span id="pinmsg" style="font-size:.72rem;color:#60c060"></span>
      </div>
      <p style="font-size:.65rem;color:#6a5030;margin-top:.5rem">Laisse vide pour garder le code actuel</p>
    </div>

    <div style="text-align:center">
      <button class="btn-cta" id="startgame" ${n<2?'disabled':''}>🐗 Lancer les Olympiades !</button>
      ${n<2 ? '<p style="font-size:.72rem;color:#7a6040;margin-top:.5rem">Sélectionne au moins 2 tribus</p>' : ''}
    </div>
  </div>`;
}

function bindAdminSetup() {
  document.getElementById('logoutbtn')?.addEventListener('click', () => { ui.mode = 'public'; render(); });
  document.getElementById('selall')?.addEventListener('click', () => {
    gs.selected = gs.selected.length === TRIBES.length ? [] : [...ALL_IDS];
    render();
  });
  document.querySelectorAll('[data-tribe]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.tribe;
      const i = gs.selected.indexOf(id);
      if (i >= 0) gs.selected.splice(i, 1); else gs.selected.push(id);
      render();
    });
  });
  document.getElementById('savepin')?.addEventListener('click', async () => {
    const v = document.getElementById('newpin').value.trim();
    if (v.length >= 2) {
      await savePin(v);
      document.getElementById('pinmsg').textContent = '✓ Code enregistré !';
      toast('✓ Nouveau code enregistré');
    } else {
      document.getElementById('pinmsg').textContent = 'Min. 2 caractères.';
    }
  });
  document.getElementById('startgame')?.addEventListener('click', async () => {
    if (gs.selected.length < 2) return;
    gs.scores = {};
    gs.phase = 'game';
    await saveState();
    ui.mode = 'admin-game';
    ui.activeCat = 'degustation';
    loadCatInputs();
    render();
  });
}

/* ══════════════════════════════════════════════════════
   ADMIN GAME — saisie par catégorie
══════════════════════════════════════════════════════ */
function buildAdminGame() {
  const rnk = ranking();
  const medals = ['🥇','🥈','🥉'];
  const activeC = cat(ui.activeCat);
  const filled = catsFilledCount();

  return `
  <div class="admin-bar">
    <div style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap">
      <span class="admin-badge">⚙️ ANIMATEUR</span>
      <span class="round-badge">${filled}/${CATEGORIES.length} épreuves notées</span>
    </div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap">
      <button class="btn-danger" id="logoutbtn" style="font-size:.68rem;padding:.35rem .8rem">Quitter</button>
    </div>
  </div>

  <div class="screen" style="padding-top:1rem">

    <!-- Onglets catégories -->
    <div class="cat-tabs">
      ${CATEGORIES.map(c => `
        <button class="cat-tab ${c.id === ui.activeCat ? 'active' : ''}" data-cat="${c.id}">
          ${c.emo} ${c.short}
          ${catHasScores(c.id) ? '<span class="done-dot"></span>' : ''}
        </button>`).join('')}
    </div>

    <div class="game-grid">
      <!-- Saisie catégorie active -->
      <div class="glass" style="overflow-y:auto;max-height:560px">
        <p class="section-label">${activeC.emo} ${activeC.name} — Saisie des points</p>
        ${gs.selected.map(id => {
          const t = tribe(id);
          return `
          <div class="score-row">
            <span style="font-size:1.2rem">${t.emo}</span>
            <span style="flex:1;font-size:.76rem;font-weight:700;color:#e0d0b0">${t.name}</span>
            <input class="score-input" type="number" data-id="${id}"
              value="${ui.inputs[id]||''}" placeholder="0">
          </div>`;
        }).join('')}
        <div style="text-align:center;margin-top:1.2rem">
          <button class="btn-cta" id="savecat" style="padding:.8rem 1.8rem;font-size:.82rem">
            💾 Enregistrer ${activeC.short}
          </button>
        </div>
      </div>

      <!-- Classement live -->
      <div class="glass" style="overflow-y:auto;max-height:560px">
        <p class="section-label">📊 Classement général</p>
        ${rnk.map((id, i) => {
          const t = tribe(id); const sc = total(id);
          const cmap = {0:'#ffd700', 1:'#c0c0c0', 2:'#cd7f32'};
          return `
          <div class="rank-row ${i<3?'r'+(i+1):''}">
            <span style="font-size:1rem;min-width:26px">${medals[i]||`${i+1}.`}</span>
            <span style="font-size:1.1rem">${t.emo}</span>
            <span style="flex:1;font-size:.76rem;font-weight:700">${t.name}</span>
            <span class="rank-score" style="color:${cmap[i]||'#e0d0b0'}">${sc} pts</span>
          </div>`;
        }).join('')}
      </div>
    </div>

    <!-- Tableau détail complet -->
    ${buildDetailTable()}

    <div style="margin-top:1.2rem;text-align:center">
      <button class="btn-danger" id="resetgame" style="font-size:.7rem">
        🔄 Réinitialiser la partie
      </button>
    </div>
  </div>`;
}

function bindAdminGame() {
  document.getElementById('logoutbtn')?.addEventListener('click', () => { ui.mode = 'public'; render(); });
  /* changer de catégorie */
  document.querySelectorAll('[data-cat]').forEach(el => {
    el.addEventListener('click', () => {
      ui.activeCat = el.dataset.cat;
      loadCatInputs();
      render();
    });
  });
  /* saisie */
  document.querySelectorAll('.score-input').forEach(inp => {
    inp.addEventListener('input', e => { ui.inputs[e.target.dataset.id] = e.target.value; });
  });
  /* enregistrer la catégorie */
  document.getElementById('savecat')?.addEventListener('click', async () => {
    gs.selected.forEach(id => {
      if (!gs.scores[id]) gs.scores[id] = {};
      const v = parseInt(ui.inputs[id]);
      gs.scores[id][ui.activeCat] = isNaN(v) ? 0 : v;
    });
    await saveState();
    toast(`✓ ${cat(ui.activeCat).name} enregistré !`);
    render();
  });
  document.getElementById('resetgame')?.addEventListener('click', async () => {
    if (confirm('Réinitialiser complètement la partie ? Tous les scores seront perdus.')) {
      gs = {phase:'waiting', selected:[...ALL_IDS], scores:{}};
      await saveState(); ui.mode = 'admin-setup'; render();
    }
  });
}

/* ── START ── */
init();
</script>
</body>
</html>
